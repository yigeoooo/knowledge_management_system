[project]
name = "dexforce-knowledge-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4.1,<5",
  "Flask-Limiter>=4,<5",
  "argon2-cffi>=25.1,<26",
  "PyJWT>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "python-dotenv>=1.1,<2",
  "gunicorn>=23,<24",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
